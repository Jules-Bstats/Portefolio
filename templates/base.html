<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portfolio data de Jules Bouscaud{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Barre de navigation flottante -->
<header class="floating-navbar">
    <a href="{{ url_for('home') }}" class="navbar-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <span>Portfolio Data</span>
    </a>

    <nav class="navbar-links" id="navbarLinks">
        <a href="{{ url_for('home') }}">Accueil</a>
        <a href="{{ url_for('projets') }}">Projets</a>
        <a href="{{ url_for('stage') }}">Stage</a>
        <a href="{{ url_for('a_propos') }}">À propos de moi</a>
    </nav>

    <span class="navbar-status">
        <span class="status-dot"></span>
        <span>À la recherche d'un stage</span>
    </span>

    <button class="navbar-mobile-toggle" id="navbarMobileToggle" aria-label="Ouvrir le menu">
        <span></span><span></span><span></span>
    </button>
</header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <a href="mailto:ton.email@exemple.com" class="footer-cta">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 6L12 13L21 6M4 5H20C20.5523 5 21 5.44772 21 6V18C21 18.5523 20.5523 19 20 19H4C3.44772 19 3 18.5523 3 18V6C3 5.44772 3.44772 5 4 5Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Me contacter
            </a>

            <div class="footer-icons">
                <a href="tel:+33600000000" class="footer-icon" data-tooltip="Appeler">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6.6 10.8C7.9 13.3 9.9 15.3 12.4 16.6L14.3 14.7C14.6 14.4 15 14.3 15.4 14.5C16.6 14.9 17.9 15.1 19.2 15.1C19.8 15.1 20.3 15.6 20.3 16.2V19.6C20.3 20.2 19.8 20.7 19.2 20.7C10.2 20.7 3 13.5 3 4.5C3 3.9 3.5 3.4 4.1 3.4H7.5C8.1 3.4 8.6 3.9 8.6 4.5C8.6 5.8 8.8 7.1 9.2 8.3C9.4 8.7 9.3 9.1 9 9.4L6.6 10.8Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>

                <a href="https://linkedin.com/in/tonprofil" target="_blank" class="footer-icon" data-tooltip="LinkedIn">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.6"/>
                        <path d="M7.5 10V17M7.5 7V7.01M12 17V13C12 11.6 12.8 10.5 14.2 10.5C15.5 10.5 16 11.4 16 13V17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>

                <a href="https://github.com/tonpseudo" target="_blank" class="footer-icon" data-tooltip="GitHub">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 3C7 3 3 7 3 12C3 16 5.6 19.4 9.3 20.6C9.8 20.7 10 20.4 10 20.1V18.3C7.4 18.9 6.9 17.2 6.9 17.2C6.5 16.2 5.9 16 5.9 16C5.1 15.4 6 15.4 6 15.4C6.8 15.5 7.3 16.3 7.3 16.3C8.1 17.6 9.4 17.2 9.8 17C9.9 16.4 10.1 16 10.4 15.8C8.3 15.5 6.1 14.7 6.1 11.1C6.1 10.1 6.5 9.3 7.1 8.6C7 8.4 6.7 7.5 7.2 6.3C7.2 6.3 8 6 10 7.4C10.8 7.2 11.7 7.1 12.6 7.1C13.4 7.1 14.3 7.2 15.1 7.4C17.1 6 17.9 6.3 17.9 6.3C18.4 7.5 18.1 8.4 18 8.6C18.6 9.3 19 10.1 19 11.1C19 14.7 16.8 15.5 14.6 15.8C15 16.1 15.3 16.7 15.3 17.6V20.1C15.3 20.4 15.5 20.7 16 20.6C19.7 19.4 22.3 16 22.3 12C22.3 7 18.3 3 13.3 3H12Z" fill="currentColor"/>
                    </svg>
                </a>
            </div>
        </div>
    </footer>

    <button class="scroll-top" id="scrollTop" aria-label="Remonter en haut">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 19V5M12 5L6 11M12 5L18 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>   

    <script src="{{ url_for('static', filename='js/nav.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
